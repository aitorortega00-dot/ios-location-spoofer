name: build-unsigned
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Seleccionar Xcode mas reciente
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$LATEST_XCODE"
          xcodebuild -version

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Compilar libreria Go
        run: |
          cd GoSpoofer
          chmod +x make.sh
          ./make.sh

      - name: Regenerar proyecto con xcodegen
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Quitar AppIcon.icon (falla en CI)
        run: |
          sed -i '' '/AppIcon\.icon/d' location-spoofer.xcodeproj/project.pbxproj
          grep -c "AppIcon.icon" location-spoofer.xcodeproj/project.pbxproj || true

      - name: Compilar sin firma (iOS 16)
        run: |
          xcodebuild build \
            -project location-spoofer.xcodeproj \
            -scheme location-spoofer \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 \
            ASSETCATALOG_COMPILER_APPICON_NAME="" > build.log 2>&1 || true
          echo "=========== RESUMEN DE ERRORES ==========="
          grep -E "error:|BUILD (FAILED|SUCCEEDED)" build.log | sort -u | cut -c1-400 | head -30
          echo "=========== FIN RESUMEN ==========="
          grep -q "BUILD SUCCEEDED" build.log

      - name: Subir log completo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Preparar Payload
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/*.app Payload/
          APP=Payload/location-spoofer.app
          for P in "$APP/Info.plist" "$APP/PlugIns/location-spoofer-tunnel.appex/Info.plist"; do
            /usr/libexec/PlistBuddy -c "Set :MinimumOSVersion 16.0" "$P" || true
            echo "$P -> MinimumOSVersion: $(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$P")"
          done

      - name: Firmar con entitlements (ldid)
        run: |
          brew install ldid
          APP=Payload/location-spoofer.app
          APPEX=$APP/PlugIns/location-spoofer-tunnel.appex
          for F in "$APP"/Frameworks/*.dylib; do ldid -S "$F"; done
          ldid -STunnel/location-spoofer-tunnel.entitlements "$APPEX/location-spoofer-tunnel"
          ldid -SResources/location-spoofer.entitlements "$APP/location-spoofer"
          echo "=== Entitlements de la app ==="
          ldid -e "$APP/location-spoofer"
          echo "=== Entitlements del tunel ==="
          ldid -e "$APPEX/location-spoofer-tunnel"

      - name: Empaquetar
        run: zip -qry app.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ipa-firmado
          path: app.ipa
