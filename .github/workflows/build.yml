name: build-unsigned
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Seleccionar Xcode mas reciente
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$LATEST_XCODE"
          xcodebuild -version

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Compilar libreria Go
        run: |
          cd GoSpoofer
          chmod +x make.sh
          ./make.sh

      - name: Compilar sin firma
        run: |
          xcodebuild build \
            -project location-spoofer.xcodeproj \
            -scheme location-spoofer \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Mostrar estructura y entitlements
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/*.app Payload/
          find Payload -maxdepth 4
          find . -name "*.entitlements" -not -path "./build/*" -exec sh -c 'echo "---- $1"; cat "$1"' _ {} \;

      - name: Empaquetar
        run: zip -qr app.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ipa-sin-firmar
          path: app.ipa
