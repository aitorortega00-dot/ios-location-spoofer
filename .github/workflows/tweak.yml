name: build-tweak
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Instalar herramientas
        run: brew install ldid dpkg make

      - name: Instalar Theos
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Compilar tweak (rootless)
        run: |
          cd tweak
          set -o pipefail
          if ! gmake package FINALPACKAGE=1 messages=yes 2>&1 | tee build.log; then
            grep -E "error|Error|fatal|No such|not found" build.log | sort -u | head -25 | while IFS= read -r l; do
              echo "::error::${l:0:400}"
            done
            tail -15 build.log | while IFS= read -r l; do echo "::warning::${l:0:400}"; done
            exit 1
          fi
          ls -la packages

      - uses: actions/upload-artifact@v4
        with:
          name: tweak-deb
          path: tweak/packages/*.deb
